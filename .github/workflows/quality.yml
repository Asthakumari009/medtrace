name: MedTrace quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: test-only-publishable-key
      EXPO_PUBLIC_API_URL: http://localhost:8000
      VITA_TEST_URL: http://localhost:8083
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: npm ci
      - run: pip install -r api/requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npx expo install --check
      - run: npx expo export --platform web --output-dir artifacts/web
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: artifacts/test-results
          retention-days: 7
